<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Tristan!</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Comic Sans MS","Comic Neue",cursive,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;background:repeating-linear-gradient(45deg,#ffe600 0 18px,#ff6ad5 18px 36px,#59f0ff 36px 54px)}
#app{transition:opacity .5s;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-bottom:34px;box-sizing:border-box}
.box{background:#fff;border:4px solid #000;box-shadow:5px 5px 0 #000;padding:8px 14px;text-align:center}
#cap1{transform:rotate(-2deg);max-width:min(88vw,380px)}
#lvl{font-family:Impact,sans-serif;font-size:22px;color:#e11d8c;letter-spacing:1px}
#txt{font-size:15px;color:#111;margin-top:2px}
#stage{position:relative;width:min(62vw,38vh,300px);aspect-ratio:433/577;will-change:transform;cursor:grab}
#stage img,#stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#candle{position:absolute;left:50%;top:20%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;pointer-events:none}
#flame{font-size:30px;line-height:1}
.stick{width:14px;height:50px;border:3px solid #000;background:repeating-linear-gradient(45deg,#ff6ad5 0 6px,#fff 6px 12px)}
#bar{width:min(72vw,300px);height:22px;border:4px solid #000;background:#fff;box-shadow:4px 4px 0 #000}
#fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#0a0 0 10px,#fff 10px 12px)}
.deco{position:fixed;font-size:44px;pointer-events:none;animation:wob 2s ease-in-out infinite alternate}
@keyframes wob{to{transform:rotate(14deg) scale(1.15)}}
#mq{position:fixed;left:0;right:0;bottom:0;height:30px;background:#000;color:#ffe600;overflow:hidden;white-space:nowrap;line-height:30px;font-weight:700;z-index:2}
#mq span{display:inline-block;padding-left:100%;animation:mq 24s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#clear{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-6deg) scale(0);font-family:Impact,sans-serif;font-size:clamp(40px,12vw,80px);color:#ffe600;-webkit-text-stroke:3px #000;text-shadow:5px 5px 0 #e11d8c;transition:transform .3s cubic-bezier(.2,1.8,.4,1);z-index:8;pointer-events:none;white-space:nowrap}
#clear.on{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}
.fly{position:fixed;font-size:28px;pointer-events:none;z-index:6;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translateY(-120px) rotate(40deg);opacity:0}}
#msg{position:fixed;inset:0;box-sizing:border-box;padding-bottom:215px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .6s}
#msg.on{opacity:1}
#msg h1{margin:0;padding:12px 16px;line-height:1.2;font-family:Impact,sans-serif;font-size:clamp(22px,min(7.5vw,8vh),54px);color:#000000;text-align:center;background:#fff;border:4px solid #000;box-shadow:6px 6px 0 #000;transform:scale(.6) rotate(-2deg);transition:transform .7s cubic-bezier(.2,1.6,.4,1)}
#msg.on h1{transform:scale(1) rotate(-2deg)}
.btn{pointer-events:auto;border:3px solid #000;background:#fff;box-shadow:3px 3px 0 #000;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}

/* heartbeat pulse */
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.12)}
  28%{transform:scale(1)}
  42%{transform:scale(1.12)}
  70%{transform:scale(1)}
}
/* soft glow ring */
@keyframes glowPulse{
  0%,100%{box-shadow:3px 3px 0 #000, 0 0 0 0 rgba(225,29,140,.7)}
  50%{box-shadow:3px 3px 0 #000, 0 0 0 12px rgba(225,29,140,0)}
}
/* wiggle the emoji */
@keyframes nudge{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-12deg)}
  75%{transform:rotate(12deg)}
}

#formalBtn{
  position:relative;
  background:#ffe600;              /* pops against the white boxes */
  border:4px solid #000;
  box-shadow:4px 4px 0 #000;
  font-size:18px;                  /* bigger than siblings */
  font-weight:700;
  padding:10px 22px;
  animation:heartbeat 1.6s ease-in-out infinite,
            glowPulse 1.6s ease-in-out infinite;
  animation-delay:1.2s;            /* starts after #msg fades in */
}
#formalBtn .emoji{
  display:inline-block;
  animation:nudge 1s ease-in-out infinite;
}
/* pause the beat once clicked so it feels "done" */
#formalBtn.clicked{
  animation:none;
  background:#fff;
  transform:scale(.96);
}

#formal{position:fixed;inset:0;z-index:20;background:#faf6f0;color:#3b3228;font-family:Georgia,"Times New Roman",serif;overflow-y:auto;touch-action:pan-y;opacity:0;pointer-events:none;transition:opacity .8s;padding-bottom:40px}
#formal.on{opacity:1;pointer-events:auto}
#formal header{text-align:center;padding:56px 20px 28px}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#a08c75}
#ftitle{font-weight:400;font-style:italic;font-size:clamp(34px,9vw,60px);margin:10px 0}
.rule{width:60px;height:1px;background:#c9b8a2;margin:14px auto}
#fsub{font-size:15px;color:#7a6b5a;margin:0}
#fback{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;background:none;border:none;color:#a08c75;font:inherit;font-size:14px;cursor:pointer;z-index:2}
#grid{columns:3 150px;column-gap:10px;max-width:1000px;margin:0 auto;padding:0 14px}
#grid img{width:100%;height:auto;margin-bottom:10px;break-inside:avoid;display:block;cursor:pointer;border-radius:2px;box-shadow:0 2px 8px rgba(80,60,40,.15);opacity:0;transition:opacity .6s}
#grid img.in{opacity:1}
#lb{position:fixed;inset:0;z-index:30;background:rgba(20,16,12,.96);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lbimg{max-width:94vw;max-height:84vh;object-fit:contain}
.lbn,#lbx{position:absolute;background:none;border:none;color:#e9dfd1;font-size:40px;cursor:pointer;padding:10px}
.lbn{top:50%;margin-top:-30px}#lbp{left:6px}#lbn{right:6px}#lbx{top:6px;right:10px;font-size:26px}
#lbc{position:absolute;bottom:18px;color:#a08c75;font-family:Georgia,serif;font-size:13px;letter-spacing:.1em}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.card{position:relative;flex:0 0 auto;margin-top:14px;background:#fff;border:2px solid #000;padding:5px;box-sizing:border-box;box-shadow:3px 3px 0 #000;cursor:pointer;transform:rotate(var(--tilt));animation:drop .7s cubic-bezier(.3,1.4,.5,1) backwards}
.card img{display:block;height:var(--ch,120px);width:auto;max-width:70vw;pointer-events:none}
.card::before{content:"";position:absolute;top:-12px;left:50%;width:10px;height:22px;margin-left:-5px;background:#e11d8c;border:2px solid #000;border-radius:2px}
@keyframes drop{from{transform:translateY(-70vh) rotate(0);opacity:0}}
#line{position:fixed;left:0;right:0;bottom:34px;z-index:5;display:none;gap:14px;overflow-x:auto;padding:0 16px 8px;touch-action:pan-x;-webkit-overflow-scrolling:touch;background:linear-gradient(#000,#000) 0 10px/100% 3px no-repeat local}
#line.on{display:flex}
.nav{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;font-size:18px;padding:0;z-index:2}
#prev{left:10px}#next{right:10px}
#cnt{position:absolute;bottom:5%;font-weight:700;color:#111;background:#fff;border:3px solid #000;padding:2px 12px}
.ph,#bigph{width:100%;height:100%;background:linear-gradient(135deg,#f9a8d4,#ec4899) center/cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px}
#view{position:fixed;inset:0;z-index:10;background:rgba(255,255,255,.9);opacity:0;pointer-events:none;transition:opacity .35s;display:flex;align-items:center;justify-content:center;cursor:pointer}
#view.on{opacity:1;pointer-events:auto}
#big{position:relative;background:#fff;border:4px solid #000;padding:12px 12px 52px;box-sizing:border-box;box-shadow:8px 8px 0 #000;will-change:transform}
#bigimg{display:block;max-width:min(80vw,560px);max-height:62vh;width:auto;height:auto}
#bigph{font-size:72px}
#cap{position:absolute;left:12px;right:12px;bottom:14px;text-align:center;color:#111;font-size:16px}
</style></head><body>

let level=0,busy=false,done=false,down=false,blow=false,lastA=null,ema=0,progress=0,speed=0,spin=0,pieces=[];
let musicStarted=false,musicPending=false,musicFade=null;

function stopBirthdayMusic(){
  if(musicFade){clearInterval(musicFade);musicFade=null;}
  song.pause();
  song.currentTime=0;
  song.volume=0;
  musicStarted=false;
  musicPending=false;
}

function startBirthdayMusic(){
  // Music is locked until the final birthday message is revealed.
  if(!done || musicStarted) return;

  song.currentTime=0;
  song.volume=0;

  const playPromise=song.play();
  if(!playPromise){
    musicStarted=true;
    fadeInBirthdayMusic();
    return;
  }

  playPromise.then(()=>{
    musicStarted=true;
    musicPending=false;
    $("mute").textContent="🔇 pause music";
    fadeInBirthdayMusic();
  }).catch(()=>{
    // Some browsers block delayed autoplay. Start on the first tap after the reveal.
    musicPending=true;
    $("mute").textContent="▶ tap to play music";
  });
}

function fadeInBirthdayMusic(){
  if(musicFade) clearInterval(musicFade);
  musicFade=setInterval(()=>{
    if(!done || song.paused){
      clearInterval(musicFade);
      musicFade=null;
      return;
    }
    song.volume=Math.min(0.95,song.volume+0.05);
    if(song.volume>=0.95){
      clearInterval(musicFade);
      musicFade=null;
    }
  },60);
}

function resumeBirthdayMusic(){
  if(!done || (!musicPending && musicStarted)) return;
  song.play().then(()=>{
    musicStarted=true;
    musicPending=false;
    $("mute").textContent="🔇 pause music";
    fadeInBirthdayMusic();
  }).catch(()=>{
    musicPending=true;
  });
}

document.addEventListener("pointerdown",()=>{
  if(done && musicPending) resumeBirthdayMusic();
});
function setLevel(){progress=0;busy=false;stopBirthdayMusic();$("mute").textContent="🔊 music starts at the end";$("lvl").textContent=LV[level].t;$("txt").textContent=LV[level].x;$("candle").style.display=level==2?"flex":"none"}
function center(){const r=stage.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height*0.4}}
function ang(e){const c=center();return Math.atan2(e.clientY-c.y,e.clientX-c.x)}
let pend=false;
function end(){ down=false; blow=false; lastA=null; }
addEventListener("pointerdown",e=>{
  if(done||busy)return;down=true;
  if(level==0)lastA=ang(e);else if(level==1)tap(e);else blow=true;
});
addEventListener("pointerup",end);addEventListener("pointercancel",end);
addEventListener("pointermove",e=>{
  if(!down||done||busy||level!=0)return;
  const a=ang(e);let d=a-lastA;lastA=a;
  if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
  ema=ema*0.85+d*0.15;
  const good=d*Math.sign(ema||1);
  if(good>0){progress=Math.min(1,progress+good/(2*Math.PI*TURNS));spin+=d}
  speed=Math.min(1,speed+Math.abs(d)*0.6);
  if(progress>=1)levelUp();
});
function tap(e){
  progress=Math.min(1,progress+1/12);speed=.6;
  const s=document.createElement("span");s.className="fly";s.textContent=T[Math.random()*T.length|0];
  s.style.left=e.clientX-14+"px";s.style.top=e.clientY-14+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),900);
  if(progress>=1)levelUp();
}
function levelUp(){
  busy=true;end();progress=1;$("clear").classList.add("on");
  setTimeout(()=>{$("clear").classList.remove("on");level++;level>=LV.length?finish():setLevel()},1300);
}
function swirl(){
  const w=433,h=577,cx=212,cy=212,rx=180,ry=76;
  ctx.clearRect(0,0,w,h);ctx.save();
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.clip();
  for(let k=0;k<6;k++){
    ctx.beginPath();
    for(let i=0;i<=40;i++){const r=0.1+0.9*i/40,t=spin*1.5+k*Math.PI/3+r*3.2;
      const x=cx+rx*r*Math.cos(t),y=cy+ry*r*Math.sin(t);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.strokeStyle=k%2?"rgba(255,255,255,0.35)":"rgba(190,30,110,0.22)";
    ctx.lineWidth=10;ctx.lineCap="round";ctx.stroke();
  }
  ctx.restore();
}
function loop(){
  if(blow)speed=Math.max(speed,.15);
  speed*=0.93;
  const s=done?0:speed;
  stage.style.transform="translate("+(Math.random()-.5)*10*s+"px,"+(Math.random()-.5)*6*s+"px) rotate("+(Math.random()-.5)*3*s+"deg)";
  if(level==2&&!done&&!busy){
    progress=blow?Math.min(1,progress+1/140):Math.max(0,progress-1/300);
    if(progress>=1)levelUp();
  }
  $("flame").style.transform="scale("+(1-progress*.8)*(0.9+Math.random()*.3)+")";
  $("flame").style.opacity=1-progress*.9;
  fill.style.width=progress*100+"%";
  swirl();updateCards();
  if(pieces.length){
    cx2.clearRect(0,0,conf.width,conf.height);
    pieces.forEach(p=>{p.vy+=0.08;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.r);cx2.fillStyle=p.c;cx2.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6);cx2.restore()});
    pieces=pieces.filter(p=>p.y<conf.height+30);
  }
  requestAnimationFrame(loop);
}
function size(){conf.width=innerWidth;conf.height=innerHeight}
addEventListener("resize",size);size();
function finish(){
  done=true;
  fill.style.width="100%";
  msg.classList.add("on");
  spawnCards();

  // Wait for the final birthday message to appear before starting the music.
  // If the browser blocks autoplay, the first tap after the reveal starts it.
  stopBirthdayMusic();
  $("mute").textContent="▶ tap to play music";
  setTimeout(startBirthdayMusic,700);

  const cols=["#ec4899","#f9a8d4","#fbbf24","#60a5fa","#34d399","#a78bfa"];
  for(let i=0;i<220;i++)pieces.push({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-2,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[i%cols.length]});
}
$("again").addEventListener("click",e=>{
  e.stopPropagation();$("formal").classList.remove("on");done=false;level=0;ema=0;spin=0;stopBirthdayMusic();$("mute").textContent="🔊 music starts at the end";
  msg.classList.remove("on");clearCards();setLevel();
});
$("mute").addEventListener("click",()=>{
  // Never allow this control to start music before the final level is complete.
  if(!done) return;

  if(song.paused){
    resumeBirthdayMusic();
    if(!musicPending) $("mute").textContent="🔇 pause music";
  }else{
    song.pause();
    if(musicFade){clearInterval(musicFade);musicFade=null;}
    $("mute").textContent="🔊 play music";
  }
});
const cards=[];
const view=$("view"),big=$("big"),bigimg=$("bigimg"),cap=$("cap"),line=$("line");
let cur=-1,sx=0;
const COUNT=()=>PHOTOS.length||20;
function cardW(){return Math.min(Math.max(innerWidth*0.3,100),150,innerHeight*0.24)}
function setBig(i){
  const p=PHOTOS[i]||{};
  bigimg.src=p.src||"";
  cap.textContent=p.caption||"";$("cnt").textContent=(i+1)+" / "+COUNT();
}
function spawnCards(){
  const h=cardW();line.style.setProperty("--ch",h+"px");line.classList.add("on");msg.style.paddingBottom=(h+96)+"px";$("app").style.opacity=0;line.scrollLeft=0;
  for(let i=0;i<COUNT();i++){
    const el=document.createElement("div");el.className="card";
    const tilt=(Math.random()-.5)*.14;el.style.setProperty("--tilt",tilt+"rad");
    el.style.animationDelay=(i*0.06)+"s";
    const im=document.createElement("img");im.alt="";im.src=(PHOTOS[i]||{}).src||"";
    el.appendChild(im);line.appendChild(el);
    el.addEventListener("click",()=>openCard(i));
    cards.push({el,tilt});
  }
}
function updateCards(){}
function fromT(c){
  const r=c.el.getBoundingClientRect(),s=c.el.offsetWidth/big.offsetWidth;
  return "translate("+(r.left+r.width/2-innerWidth/2)+"px,"+(r.top+r.height/2-innerHeight/2)+"px) scale("+s+") rotate("+c.tilt+"rad)";
}
async function openCard(i){
  if(cur>=0)return;cur=i;const c=cards[i];setBig(i);
  try{await bigimg.decode()}catch(e){}
  big.style.transition="none";big.style.transform=fromT(c);
  c.el.style.opacity=0;view.classList.add("on");
  void big.offsetWidth;
  big.style.transition="transform .6s cubic-bezier(.2,1.25,.35,1)";big.style.transform="none";
}
function go(d){
  const n=cards.length;cards[cur].el.style.opacity=1;
  cur=(cur+d+n)%n;cards[cur].el.style.opacity=0;setBig(cur);
  big.animate([{transform:"translateX("+d*70+"px) rotate("+d*5+"deg)",opacity:0},{transform:"none",opacity:1}],{duration:260,easing:"ease-out"});
}
function closeCard(){
  if(cur<0)return;const k=cur,c=cards[k];
  c.el.scrollIntoView({inline:"center",block:"nearest"});
  big.style.transition="transform .45s cubic-bezier(.5,0,.75,0)";big.style.transform=fromT(c);
  view.classList.remove("on");
  setTimeout(()=>{if(cards[k])cards[k].el.style.opacity=1;if(cur===k)cur=-1},430);
}
view.addEventListener("pointerdown",e=>{sx=e.clientX});
view.addEventListener("pointerup",e=>{
  if(e.target.closest(".nav"))return;
  const dx=e.clientX-sx;
  if(Math.abs(dx)>40)go(dx<0?1:-1);else closeCard();
});
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
function clearCards(){
  line.innerHTML="";line.classList.remove("on");$("app").style.opacity=1;cards.length=0;view.classList.remove("on");cur=-1;
}
const HER="Joy",WITHJOY=Array.from({length:55},(_,i)=>({src:"withJoy/"+(i+1)+".jpg"})); // withJoy/1.jpg … withJoy/48.jpg
$("ftitle").textContent="Tristan & "+HER;$("fsub").textContent="a few of your favorite moments";
const grid=$("grid"),lb=$("lb"),lbimg=$("lbimg");let li=0,lsx=0,built=false;
function openFormal(){
  if(!built){built=true;WITHJOY.forEach((p,i)=>{const im=new Image();im.alt="";im.onload=im.onerror=()=>im.classList.add("in");im.src=p.src;im.onclick=()=>openLb(i);grid.appendChild(im)})}
  $("formal").classList.add("on");$("formal").scrollTop=0;
}
function showLb(){lbimg.src=WITHJOY[li].src;$("lbc").textContent=(li+1)+" / "+WITHJOY.length}
function openLb(i){li=i;showLb();lb.classList.add("on")}
function lbGo(d){li=(li+d+WITHJOY.length)%WITHJOY.length;showLb()}
$("formalBtn").onclick=openFormal;
$("fback").onclick=()=>$("formal").classList.remove("on");
$("lbp").onclick=()=>lbGo(-1);$("lbn").onclick=()=>lbGo(1);$("lbx").onclick=()=>lb.classList.remove("on");
lb.addEventListener("pointerdown",e=>{lsx=e.clientX});
lb.addEventListener("pointerup",e=>{
  if(e.target.closest("button"))return;
  const dx=e.clientX-lsx;
  if(Math.abs(dx)>40)lbGo(dx<0?1:-1);else if(e.target===lb)lb.classList.remove("on");
});
setLevel();loop();
</script></body></html>
